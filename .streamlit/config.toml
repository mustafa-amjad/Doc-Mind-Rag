# Same design system as the web app (web/src/styles.css): warm paper, near-black sidebar,
# one emerald accent, Instrument Serif headings over Inter. One look only (no dark-mode switch).
[theme]
base = "light"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "'Instrument Serif':https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false
headingFontSizes = ["44px", "30px", "24px", "18px", "15px", "13px"]
headingFontWeights = [400, 400, 400, 500, 500, 500]

primaryColor = "#0B5D45"
backgroundColor = "#F6F5F1"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#EFEDE7"
textColor = "#141412"
borderColor = "#DAD6CD"
linkColor = "#0B5D45"
grayColor = "#66645E"
greenColor = "#0B5D45"
greenBackgroundColor = "#E5F2EC"
greenTextColor = "#0B5D45"
blueColor = "#1E3A8A"
violetColor = "#5B21B6"
redColor = "#B42318"
orangeColor = "#9A3412"
# cited sentences in the source viewer use :orange-background[...], so this is the highlight yellow
orangeBackgroundColor = "#F7E7A1"

[theme.sidebar]
backgroundColor = "#141412"
secondaryBackgroundColor = "#1D1C19"
codeBackgroundColor = "#1D1C19"
textColor = "#EDEBE6"
borderColor = "#2E2D29"
grayColor = "#A9A69E"
primaryColor = "#0B5D45"

[server]
maxUploadSize = 200

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
