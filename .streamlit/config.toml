# Same design system as the web app (web/src/styles.css): one sans typeface (Geist) for
# everything, white page, a sidebar one shade darker (no dark/light split), emerald accent.
[theme]
base = "light"
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
headingFont = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
codeFont = "'Geist Mono':https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
headingFontSizes = ["28px", "22px", "18px", "16px", "15px", "13px"]
headingFontWeights = [600, 600, 600, 600, 500, 500]

primaryColor = "#0B5D45"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F2"
codeBackgroundColor = "#F4F4F2"
textColor = "#1A1A19"
borderColor = "#E5E4E0"
linkColor = "#0B5D45"
grayColor = "#5F5E5A"
greenColor = "#0B5D45"
greenBackgroundColor = "#E5F2EC"
greenTextColor = "#0B5D45"
blueColor = "#1E3A8A"
violetColor = "#5B21B6"
redColor = "#B42318"
orangeColor = "#9A3412"
# cited sentences in the source viewer use :orange-background[...], so this is the highlight yellow
orangeBackgroundColor = "#F7E7A1"

[theme.sidebar]
backgroundColor = "#F7F7F5"
secondaryBackgroundColor = "#EDEDEA"
codeBackgroundColor = "#EDEDEA"
textColor = "#1A1A19"
borderColor = "#E5E4E0"
grayColor = "#5F5E5A"
primaryColor = "#0B5D45"

[server]
maxUploadSize = 200

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
